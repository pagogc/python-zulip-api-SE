[redmine]
redmine_url = <url of your redmine instance>
redmine_token = <redmine api token>
domain = <url of your zulip instance>
allowed_users = <email fragments of allowed_users>
users_to_redirect= <email fragments of users to redirect the issue>
redirect_to_redmine_userID = <redmine id to redirect to>
fallback_redmine_userID = <fallback redmine id if email not found>
zulip_rc_file=<path to bots rc file to open a zulip client>
max_attachment_mb = 95

